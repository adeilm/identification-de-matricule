[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alpr"
version = "0.1.0"
description = "Tunisian automatic license plate recognition (Computer Vision course project, FSS Sfax)"
readme = "README.md"
requires-python = ">=3.11"
# Core = only what the shared contract needs, so tests run anywhere in seconds.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Student A
vehicle = ["opencv-python>=4.9", "ultralytics>=8.3"]
ui = ["opencv-python>=4.9", "streamlit>=1.40"]
# Student B: Model 2 = YOLO (ultralytics), Model 3 = own CRNN in PyTorch (installed with ultralytics).
plate = ["opencv-python>=4.9", "ultralytics>=8.3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
